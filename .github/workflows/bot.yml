name: Ultimate Omni-Bot V21 Execution

on:
  schedule:
    - cron: '*/15 * * * 1-5'
    - cron: '0 0-22/1 * * 6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added yfinance and pytz to match the bot.py requirements
          pip install yfinance pytz pandas numpy requests websocket-client matplotlib

      - name: Run Algorithmic Trading Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 bot.py
